services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides .env's host-facing value: inside the Compose network Postgres
      # is reachable as `postgres`, not `localhost` (DECISIONS.md D-023).
      DATABASE_URL: postgresql://copilot:copilot@postgres:5432/copilot
      # Ollama runs on the host, not in Compose; `localhost` inside the
      # container is the container itself (DECISIONS.md D-049).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too (Docker Desktop does it already).
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
